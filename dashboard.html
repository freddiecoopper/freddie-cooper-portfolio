<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard | Freddie Cooper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500&display=swap">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div class="p">
<div class="in" style="padding-top:32px;padding-bottom:28px;display:flex;justify-content:space-between;align-items:baseline;gap:16px"><span class="lbl">Dashboard</span><a class="back" href="index.html">Back to site</a></div>
<div class="in"><div class="hr"></div></div>
<div class="in" style="padding-top:clamp(36px,6vw,80px);padding-bottom:28px"><h1 class="d" style="font-size:clamp(40px,6vw,88px)">Your site, at a glance.</h1></div>
<div class="in" id="auth">
<div class="authrow"><div class="f"><label class="lbl" for="tok">Dashboard token</label><input class="fld" id="tok" type="password" autocomplete="off" placeholder="The DASHBOARD_TOKEN you set on the server"></div><button class="btn" id="load" type="button">Open dashboard</button></div>
<p class="msg" id="authMsg" role="status"></p>
</div>
<div class="in" id="app" hidden>
<div class="tabs" role="group" aria-label="Sections"><button class="tab on" id="tReq" type="button" aria-pressed="true">Requests <span class="badge" id="newCount"></span></button><button class="tab" id="tTraffic" type="button" aria-pressed="false">Traffic</button><span class="grow"></span><button class="sbtn" id="refresh" type="button">Refresh</button><button class="sbtn" id="signout" type="button">Sign out</button></div>
<div class="hr" style="margin-bottom:8px"></div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<section id="reqPanel"><div class="bar"><div class="seg" id="filters" role="group" aria-label="Filter requests"></div><span class="lbl" id="reqCount"></span></div><div id="reqList"></div></section>
<section id="trafficPanel" hidden><div class="bar"><div class="seg" id="ranges" role="group" aria-label="Date range"></div><span class="lbl" id="rangeNote"></span></div><div class="stats" id="stats"></div><div class="chartbox"><svg id="chart" role="img" aria-label="Visitors and page views per day" preserveAspectRatio="none"></svg><div class="axis"><span id="axL"></span><span id="axR"></span></div><div class="legend"><span class="k1">Visitors</span><span class="k2">Page views</span></div></div><div class="tbls" id="tbls"></div></section>
<div style="height:96px"></div>
</div>
<div class="in"><div class="hr"></div></div>
<div class="in" style="display:flex;justify-content:space-between;gap:16px;padding-top:28px;padding-bottom:48px"><span class="lbl">Freddie Cooper</span><span class="lbl">Private</span></div>
<button class="ttog" id="ttog" type="button" aria-pressed="false">Dark mode</button>
</div>
<script src="js/theme.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
